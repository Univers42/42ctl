# Release for 42ctl (D11) — owned, not generated. A pushed `vX.Y.Z` tag builds the static
# Linux binaries on native runners (x86_64 + aarch64, musl → runs on every distro),
# attests SLSA build provenance, writes SHA256SUMS, and publishes the GitHub Release.
# `install.sh` and `42ctl update` consume exactly these assets:
#   42ctl-x86_64-unknown-linux-musl   42ctl-aarch64-unknown-linux-musl   SHA256SUMS
# Actions are pinned by commit SHA (re-pin with `pinact run`); checkouts keep no credentials.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Tag must equal Cargo.toml version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$want" = "$have" ] || { echo "tag v$want != Cargo.toml $have" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: musl toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build (static)
        env:
          FT_GIT_SHA: ${{ github.sha }}
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Stage asset
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/42ctl" "dist/42ctl-${{ matrix.target }}"
          file "dist/42ctl-${{ matrix.target }}"
          "dist/42ctl-${{ matrix.target }}" version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 42ctl-${{ matrix.target }}
          path: dist/42ctl-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release + upload assets
      id-token: write      # SLSA provenance (sigstore keyless)
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          chmod +x 42ctl-*
          sha256sum 42ctl-* > SHA256SUMS
          cat SHA256SUMS

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/42ctl-*

      - name: Create the release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/42ctl-* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "42ctl $GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file .github/release-notes.md
