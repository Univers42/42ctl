# Multi-arch Docker image publish for 42ctl (P6, D11).
#
# Runs AFTER release.yml succeeds (workflow_run — a release created with the job's
# GITHUB_TOKEN emits no release:published). The image is FROM scratch + the RELEASED
# static musl binary per arch, fetched and SHA-256-verified inside deploy/Dockerfile.dist:
# no second compile, no QEMU-emulated Rust build, the exact attested bytes. Pushed to
# Docker Hub, cosign-signed (keyless OIDC), SBOM + provenance attached.
#
# GATED behind the protected `publish` environment, which holds the required reviewers
# and the Docker Hub secrets DOCKER_LOGIN (username = image namespace) + DOCKER_PAT.
#
# P7-hardened: actions pinned by commit SHA (re-pin with `pinact run`).
name: docker

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v0.2.0)"
        required: true

# Minimal permissions: id-token for cosign keyless + provenance attestation.
permissions:
  contents: read
  id-token: write

concurrency:
  group: docker-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-push-sign:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: publish
    env:
      TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.tag }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push (multi-arch, from the verified release assets)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKER_LOGIN }}/42ctl:latest
            docker.io/${{ secrets.DOCKER_LOGIN }}/42ctl:${{ env.TAG }}
          build-args: |
            VERSION=${{ env.TAG }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "docker.io/${{ secrets.DOCKER_LOGIN }}/42ctl@${DIGEST}"

      - name: Generate and attach SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: docker.io/${{ secrets.DOCKER_LOGIN }}/42ctl@${{ steps.build.outputs.digest }}
