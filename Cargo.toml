[package]
name = "c42"
version = "0.1.3"
edition = "2021"
rust-version = "1.91"
description = "42ctl — the umbrella platform CLI for the 42 stack (grobase + vault42)"
license = "AGPL-3.0-only"
repository = "https://github.com/Univers42/42ctl"
homepage = "https://github.com/Univers42/42ctl"

# The crate is `c42` (crates.io names can't lead with a digit) but the command is `42ctl`.
[[bin]]
name = "42ctl"
path = "src/main.rs"

# 42ctl decrypts plaintext locally, so it never writes `unsafe` of its own.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Zero-knowledge crypto (the future `vault-crypto`) + the contracts gRPC client — pinned
# git deps on the public vault42 repo, never copied (DECISIONS D1). Pinned to develop
# 91c7c47, which carries the standalone authority plus the two pieces this crate needs from
# it: `pop_message`, the single definition of the proof-of-possession framing that both this
# signer and the authority's verifier must agree on, and `verify_request` hardened to
# `verify_strict` so a small-order key cannot authenticate.
vault42-core = { git = "https://github.com/Univers42/vault42", rev = "91c7c47" }
vault42-proto = { git = "https://github.com/Univers42/vault42", rev = "91c7c47" }
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
base64 = "0.22"
# Scope-id derivation: blake3(project_uuid_bytes || env_name_bytes)[..16] — already in the
# tree (a transitive dep), promoted to a direct dep for the scope-key orchestration verbs.
blake3 = "1"
uuid = { version = "1", features = ["v5"] }
rpassword = "7"
# Self-update (`42ctl update`): resolve the latest GitHub Release, download the static
# binary for this target, verify its SHA-256 against the release's SHA256SUMS, then swap
# atomically. Both crates were already in the tree transitively; promoted to direct deps.
sha2 = "0.10"
semver = "1"
# AWS SigV4 request signing for the S3-compatible chunk store. This is request
# authentication, not content encryption: content encryption stays in vault42-core, which
# owns it. `hmac` is already compiled in this tree as a transitive dependency of
# vault42-core, so making it direct adds no new supply-chain surface. `sha2` above is the
# same crate the update path uses.
hmac = "0.12"

[profile.release]
strip = true
lto = "thin"
