[package]
name = "c42"
version = "0.1.2"
edition = "2021"
rust-version = "1.91"
description = "42ctl — the umbrella platform CLI for the 42 stack (grobase + vault42)"
license = "AGPL-3.0-only"
repository = "https://github.com/Univers42/42ctl"
homepage = "https://github.com/Univers42/42ctl"

# The crate is `c42` (crates.io names can't lead with a digit) but the command is `42ctl`.
[[bin]]
name = "42ctl"
path = "src/main.rs"

# 42ctl decrypts plaintext locally, so it never writes `unsafe` of its own.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Zero-knowledge crypto (the future `vault-crypto`) + the contracts gRPC client — pinned
# git deps on the public vault42 repo, never copied (DECISIONS D1). Pinned to the
# feat/scope-key-crypto tip d15460e, which adds the env-secret + rotate-scope RPCs.
vault42-core = { git = "https://github.com/Univers42/vault42", rev = "d15460e" }
vault42-proto = { git = "https://github.com/Univers42/vault42", rev = "d15460e" }
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
base64 = "0.22"
# Scope-id derivation: blake3(project_uuid_bytes || env_name_bytes)[..16] — already in the
# tree (a transitive dep), promoted to a direct dep for the scope-key orchestration verbs.
blake3 = "1"
uuid = { version = "1", features = ["v5"] }
rpassword = "7"
# Self-update (`42ctl update`, D11): resolve the latest GitHub Release, download the static
# binary for this target, verify its SHA-256 against the release's SHA256SUMS, then swap
# atomically. Both crates were already in the tree transitively; promoted to direct deps.
sha2 = "0.10"
semver = "1"

[profile.release]
strip = true
lto = "thin"
